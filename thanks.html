<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanks | Empire GamePlan</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Source+Sans+3:wght@400&display=swap">
<style>
:root{
  --ink:#f4f2f8; --ink-dim:#a9a3b8; --ground:#0a0710; --panel:#140d1f; --line:#2a2135; --empire:#8b5cf6;
  --display:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --body:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6;
  margin:0; min-height:100vh; display:grid; place-items:center; -webkit-font-smoothing:antialiased}
.sky{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1px 1px at 14% 20%, #fff 50%, transparent 50%),
    radial-gradient(1px 1px at 70% 12%, #e8dcff 50%, transparent 50%),
    radial-gradient(1.4px 1.4px at 40% 44%, #fff 50%, transparent 50%),
    radial-gradient(1px 1px at 86% 63%, #d8c8ff 50%, transparent 50%),
    radial-gradient(1px 1px at 24% 79%, #fff 50%, transparent 50%),
    radial-gradient(900px 620px at 78% -8%, rgba(124,58,237,.34), transparent 62%),
    radial-gradient(760px 540px at 6% 14%, rgba(76,29,149,.30), transparent 60%);
  opacity:.9}
.card{position:relative; z-index:1; max-width:560px; margin:0 auto; padding:46px 22px; text-align:center}
img.logo{display:block; width:260px; max-width:78%; height:auto; margin:0 auto 32px}
h1{font-family:var(--display); font-size:clamp(26px,6vw,38px); font-weight:700; line-height:1.15;
  letter-spacing:-.02em; margin:0 0 18px; text-wrap:balance}
p{margin:0 0 16px}
.dim{color:var(--ink-dim); font-size:15.5px}
a.back{display:inline-block; margin-top:14px; font-family:var(--display); font-size:15px; font-weight:600;
  color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:12px 20px}
a.back:hover{border-color:var(--empire)}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="card">
  <img class="logo" src="img/asg-logo.png" alt="Aaron Sansoni Group">
  <h1>Got them &mdash; thank you</h1>
  <p>Your answers are with Nick. He'll read them before your call, so you won't have to cover the background again.</p>
  <p class="dim">If anything changes before then, or you need to move the time, reach him directly on 0489 008 856 or nick.weir@aaronsansonilive.com.</p>
  <a class="back" href="index.html">Back to the page</a>
</div>
</body>
</html>
